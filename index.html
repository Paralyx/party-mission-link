<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>Party Mission · Eintritt</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://raw.githubusercontent.com https://api.github.com; base-uri 'none'; form-action 'none'">
<style>[hidden]{display:none!important}body{background:#111;color:#eee;font:18px system-ui;display:grid;place-items:center;min-height:95vh;margin:0}main{max-width:460px;text-align:center;padding:24px}h1{color:#e9c36a}a,button{display:inline-block;background:#e9c36a;color:#111;padding:14px 24px;border:0;border-radius:14px;font:inherit;text-decoration:none}p{line-height:1.6}</style></head>
<body><main><h1>Party Mission</h1><p id="status">Party-Adresse wird geladen …</p><a id="enter" hidden>Zur Party</a><p><button id="retry" hidden>Erneut versuchen</button></p></main>
<script>
const statusEl=document.getElementById('status'),enter=document.getElementById('enter'),retry=document.getElementById('retry');
let savedGuest='';
let memorySaved=false;
const stableOrigin="https://party.trirat-wird-30.de";
const validOrigin=url=>url.protocol==='https:'&&(/^[a-z0-9-]+\.trycloudflare\.com$/.test(url.hostname)||url.origin===stableOrigin)&&!url.username&&!url.password&&!url.port&&url.pathname==='/'&&!url.search&&!url.hash;
const incoming=new URLSearchParams(location.hash.slice(1)),remember=incoming.get('remember');
const validToken=token=>typeof token==='string'&&token.length<512&&/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(token);
try{
  if(validToken(remember)){localStorage.setItem('party-guest-v1',remember);savedGuest=remember;memorySaved=localStorage.getItem('party-guest-v1')===remember;}
  else {const stored=localStorage.getItem('party-guest-v1');if(validToken(stored))savedGuest=stored;}
}catch{statusEl.textContent='Dein Browser erlaubt kein dauerhaftes Merken. Die Party funktioniert trotzdem.';}
history.replaceState(null,'',location.pathname+location.search);
function targetLink(origin){return origin+(savedGuest?'#party-resume='+savedGuest:'');}
if(validToken(remember)){
  try{const origin=new URL(incoming.get('origin'));if(validOrigin(origin))location.replace(origin.origin+'#party-memory='+(memorySaved?'saved':'unavailable'));}catch{}
}
async function load(fresh=false){retry.hidden=true;enter.hidden=true;statusEl.textContent='Party-Adresse wird geladen …';try{
const source=fresh?"https://api.github.com/repos/Paralyx/party-mission-link/contents/target.json?ref=live&":"https://raw.githubusercontent.com/Paralyx/party-mission-link/live/target.json"+'?';
const response=await fetch(source+'t='+Date.now(),{cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(12000)});if(!response.ok)throw Error();
const payload=await response.json();const data=fresh?JSON.parse(atob(payload.content)):payload;const url=new URL(data.url);if(!validOrigin(url))throw Error();
enter.href=targetLink(url.origin);enter.hidden=false;retry.hidden=false;retry.textContent='Link aktualisieren';statusEl.textContent=savedGuest?'Dein Gastprofil ist auf diesem Gerät gespeichert. Weiter geht’s zur Party.':'Weiter geht’s zum geschützten Eingang. Der Party-PC muss eingeschaltet sein.';
}catch{statusEl.textContent='Der Party-Link ist gerade nicht verfügbar. Bitte später erneut versuchen.';retry.hidden=false;}}
retry.addEventListener('click',()=>load(true));load();
</script></body></html>
